[project]
name = "polymarket-kalshi-arbitrage"
version = "0.1.0"
description = "Scanner-first Polymarket and Kalshi arbitrage research tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "fastapi>=0.104.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "black>=23.0.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
package = false
