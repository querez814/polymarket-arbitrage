# Political-event v2 is a real-data, shadow-only collection profile.  It has
# no exchange-order authority and uses isolated persistence and log artifacts.
trading:
  risk_profile: conservative
  min_edge: 0.02
  bundle_arb_enabled: false
  mm_enabled: false

mode:
  trading_mode: dry_run
  data_mode: real
  # This profile collects the independently locked political cohort only.
  # Keep legacy two-venue discovery and semantic verification completely off.
  cross_platform_enabled: false
  cross_platform_execution_enabled: false
  kalshi_enabled: true
  simulate_fills: false
  fill_probability: 0
  paper_locked_arb_enabled: false
  semantic_matching_enabled: false
  semantic_cache_path: data/political_v2_semantic_cache.db

logging:
  log_dir: logs/political-event-reaction-v2-2026-08-09
  main_log_file: political-v2.log
  trades_log_file: political-v2-trades.log
  opportunities_log_file: political-v2-opportunities.log

monitoring:
  paper_trade_db_path: data/political_v2_paper_trades.db

production:
  execution_journal_path: data/political_v2_execution_journal.sqlite3
  operator_state_path: data/political_v2_operator_state.sqlite3

platform_opportunity:
  enabled: true
  experiment_id: political-event-reaction-v2-2026-08-09
  catalog_path: data/political_v2_platform_opportunities.db
  catalog_refresh_seconds: 1800
  catalog_max_markets_per_venue: 25000
  catalog_max_pages: 500
  catalog_max_decoded_bytes: 67108864
  catalog_wall_time_seconds: 120
  lookahead_days: 7
  max_hot_contracts: 40
  min_liquidity: 100
  min_volume: 100
  queue_capacity: 10000
  hot_sampling_concurrency: 8
  hot_poll_seconds: 1
  political_max_events: 4
  political_max_contracts_per_event: 6
  political_lookahead_days: 7
  political_warm_before_hours: 24
  political_hot_before_minutes: 60
  political_warm_poll_seconds: 60
  political_hot_poll_seconds: 2
  political_event_poll_seconds: 2
  political_cooldown_poll_seconds: 10
  political_cooldown_after_hours: 2
  political_max_event_duration_hours: 30
  reviewed_pinned_event_ids:
    - kalshi:KXTRUMPMENTION-26AUG10
    - kalshi:KXTRUMPSAY-26AUG10
    - kalshi:KXSCRSENS-26
  political_milestone_max_event_tickers: 24
  political_milestone_max_pages_per_event: 2
  political_milestone_max_results_per_event: 20
  political_milestone_concurrency: 4
  political_milestone_cache_seconds: 900
  additional_fee_buffer_per_contract: 0
  # This is an unvalidated forward study. The residual structural rule is not
  # an arbitrage lane and remains disabled pending evidence.
  depth_imbalance_reaction_experimental_v1_authority: forward_only_unvalidated
  relative_value_authority: disabled
  slippage_per_contract: 0.01
  max_shadow_notional: 100
  replay_evidence_byte_cap: 4294967296
  # Dedicated causal paper simulation. This remains distinct from standard
  # projected locked paper and unconstrained shadow research marks.
  political_experimental_paper_enabled: true
  political_paper_starting_cash: 1000
  political_paper_max_total_reserved_cap: 100
  political_paper_max_position_reserved_debit: 25
  political_paper_max_open_positions: 4
  political_paper_entry_depth_fraction: 0.10
  political_paper_signal_ttl_seconds: 10
  political_paper_signal_rearm_seconds: 10
  political_paper_min_hold_seconds: 2
  political_paper_max_book_request_latency_seconds: 2
  political_paper_max_fee_fetch_latency_seconds: 2
  political_paper_max_fee_schedule_age_seconds: 60
  political_paper_one_open_position_per_contract: true
  political_paper_one_open_position_per_base_lane: true
  # Trump Say and Trump Mention share the same reviewed occurrence window.
  # Their control-paper exposure is intentionally capped below the global
  # $100/four-position envelope; this remains paper-only authority.
  political_paper_risk_groups:
    - risk_group_id: trump_aug_10
      reviewed_event_ids:
        - kalshi:KXTRUMPMENTION-26AUG10
        - kalshi:KXTRUMPSAY-26AUG10
      max_total_reserved_cap: 50
      max_open_positions: 2
  min_event_clusters: 50
  min_intents: 200
  max_research_drawdown: 50
