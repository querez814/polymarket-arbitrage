# Production-shaped, non-mutating performance test.
# Real public market data; no exchange order construction or submission.
trading:
  risk_profile: conservative
  min_edge: 0.02
  # Detection-only bundle signals do not produce paired paper fills and would
  # obscure the cross-venue execution/PnL evidence this profile is proving.
  bundle_arb_enabled: false
  mm_enabled: false
  cross_platform_max_order_size: 50
  cross_platform_edge_size_multiplier: 4
  cross_platform_max_liquidity_fraction: 0.25
  cross_platform_min_executable_size: 1

risk:
  max_order_notional: 100
  max_open_orders: 2
  max_open_positions: 10
  max_order_attempts_per_minute: 10
  max_daily_order_attempts: 100
  max_position_per_market: 100
  max_global_exposure: 1000
  max_daily_loss: 50
  max_drawdown_pct: 0.10
  trade_only_high_volume: false
  # Empty permits only strict semantic auto-approval in dry-run. Live execution
  # still requires an explicit two-venue whitelist and remains disabled below.
  whitelist: []
  blacklist: []
  strategy_exposure_limits:
    bundle_arb: 100
    cross_platform_arb: 1000
  kill_switch_enabled: true

mode:
  trading_mode: dry_run
  data_mode: real
  cross_platform_enabled: true
  cross_platform_execution_enabled: false
  kalshi_enabled: true
  min_match_similarity: 0.55
  cross_platform_refresh_seconds: 1800
  # Overnight paper observation balance. Venue execution remains disabled.
  dry_run_initial_balance: 5000
  simulate_fills: false
  fill_probability: 0
  paper_locked_arb_enabled: true
  paper_confirmation_observations: 2
  paper_slippage_buffer_per_contract: 0.02
  paper_liquidity_fraction: 0.10
  paper_pair_cooldown_seconds: 300
  semantic_matching_enabled: true
  semantic_embedding_model: text-embedding-3-large
  semantic_embedding_dimensions: 1024
  semantic_verification_model: gpt-5.6-terra
  semantic_top_k: 20
  semantic_retrieval_floor: 0.55
  # Paper-only exploration threshold. Live execution still requires whitelist.
  semantic_auto_approve_confidence: 0.90
  semantic_max_verification_candidates: 500
  # Fixed verifier budget, diversified by category/event family.
  semantic_category_cap_share: 0.60
  semantic_family_cap_share: 0.40
  semantic_exploration_share: 0.10
  semantic_book_preflight_enabled: true
  semantic_cache_path: data/semantic_cache.db
  hot_pair_limit: 25
  hot_pair_scan_seconds: 2
  cold_pair_scan_seconds: 30
  # Drop only plainly inactive markets; keep new but funded/positioned markets.
  semantic_min_polymarket_liquidity: 1
  semantic_min_polymarket_volume_24h: 1
  semantic_min_kalshi_volume: 1
  semantic_min_kalshi_open_interest: 1
  polymarket_market_resync_seconds: 1800
  polymarket_priority_refresh_seconds: 2

logging:
  console_level: INFO
  file_level: DEBUG
  log_dir: logs
  main_log_file: paper-performance.log
  trades_log_file: paper-performance-trades.log
  opportunities_log_file: paper-performance-opportunities.log

monitoring:
  snapshot_interval: 60
  heartbeat_interval: 30
  track_latency: true
  track_fill_rates: true
  paper_trade_db_path: data/paper_performance.db
  display_timezone: America/New_York

news_catalyst:
  # Log-only rollout: enable scanning after review, then separately authorize
  # priority changes with apply_priority_boost.
  enabled: true
  apply_priority_boost: false
  model: gpt-5.6-terra
  scan_interval_seconds: 1800
  lookback_hours: 6
  relevance_similarity_threshold: 0.60
  catalyst_boost_weight: 0.35
  max_news_items_per_scan: 40
  max_daily_api_calls: 60
  mispricing_detector_enabled: false
